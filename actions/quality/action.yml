name: "Node.js Tests Runner"
description: "Runs quality tests on a Node.js project"
author: "Tomas Guerreiro"
inputs:
  node-version:
    description: "The version of Node.js to use"
    required: false
    default: "20"
runs:
  using: "node20" # A versão do Node.js usada para rodar esta action
  main: "dist/index.js"

outputs:
  test-result:
    description: "The result of the test run"
branding:
  color: "blue"
  icon: "check-circle"
